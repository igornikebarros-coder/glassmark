name: Build Glassmark APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar keystore fixa (secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glassmark.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/glassmark.jks" >> "$GITHUB_ENV"

      - name: Build APK (assinado com a keystore fixa)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Mostrar assinatura do APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-(1|256) digest"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Link.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Link-debug-apk
          path: Link.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Link.apk --clobber
          else
            gh release create "$TAG" Link.apk --target "${GITHUB_SHA}" \
              --title "Link $TAG" \
              --notes "APK do Link (assinatura fixa), gerado automaticamente pelo GitHub Actions."
          fi
